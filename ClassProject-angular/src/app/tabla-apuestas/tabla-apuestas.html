<table mat-table [dataSource]="dataSource" class="mat-elevation-z2" style="background-color: white;">

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID</th>
    <td mat-cell *matCellDef="let apuesta">{{ apuesta.id}}</td>
  </ng-container>

  <ng-container matColumnDef="evento">
    <th mat-header-cell *matHeaderCellDef> Evento</th>
    <td mat-cell *matCellDef="let apuesta">{{ apuesta.evento}}</td>
  </ng-container>

  <ng-container matColumnDef="cuota1">
    <th mat-header-cell *matHeaderCellDef> Local(1)</th>
    <td mat-cell *matCellDef="let apuesta">{{ apuesta.cuota1}}</td>
  </ng-container>

  <ng-container matColumnDef="cuotaX">
    <th mat-header-cell *matHeaderCellDef> Empate(X)</th>
    <td mat-cell *matCellDef="let apuesta">{{ apuesta.cuotaX}}</td>
  </ng-container>

  <ng-container matColumnDef="cuota2">
    <th mat-header-cell *matHeaderCellDef> Visitante(2)</th>
    <td mat-cell *matCellDef="let apuesta">{{ apuesta.cuota2}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
